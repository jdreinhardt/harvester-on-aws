# Optional: VPC routes that follow the VIP. Without this ConfigMap the
# controller never touches a route table.
#
# Each key is a route table ID; each value lists destination CIDRs in that
# table, one per line (commas or spaces also work). The routes must already
# exist, pointing at any node -- the controller only replaces their target, as
# aws-vpc-move-ip does. It is read on every check, so edits apply within one
# RECHECK_INTERVAL.
#
# Kept separate from vip-controller.yaml so re-applying that manifest never
# overwrites your routes. Needs deploy/iam-policy-routes.json on the instance
# role.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vip-controller-routes
  namespace: harvester-system
data:
  rtb-0123456789abcdef0: |
    10.60.0.0/24
